openapi: 3.0.3

info:
  title: Git-Prasaaran API
  description: Git-backed Markdown documentation publishing API
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: Documents
    description: Published documentation
  - name: Repositories
    description: Application repository contexts and their published documents
  - name: Webhooks
    description: GitHub webhook integration
  - name: Health
    description: Application health

paths:
  /api/v1/documents:
    get:
      tags:
        - Documents
      summary: List published documents
      operationId: getDocuments
      responses:
        "200":
          description: All available documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /api/v1/documents/{slug}:
    get:
      tags:
        - Documents
      summary: Get a published document
      operationId: getDocument
      parameters:
        - name: slug
          in: path
          required: true
          description: Document slug
          schema:
            type: string
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/repositories:
    get:
      tags:
        - Repositories
      summary: List configured repositories
      description: Requires an authenticated user. Repository configuration responses do not include GitHub credentials.
      operationId: getRepositories
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Configured repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
        "401":
          description: Authentication is required
    post:
      tags:
        - Repositories
      summary: Register a repository
      description: Requires an authenticated user with the ADMIN role. The repository ID is generated by the server.
      operationId: createRepository
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryCreateRequest"
      responses:
        "201":
          description: Repository registered
          headers:
            Location:
              description: URI of the created repository
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          description: Request fields are missing, blank, or exceed their maximum length
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
        "403":
          description: The authenticated user does not have the ADMIN role
        "409":
          description: The GitHub owner and repository name are already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/repositories/{repositoryId}:
    parameters:
      - name: repositoryId
        in: path
        required: true
        description: Internal application repository ID
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Repositories
      summary: Get a configured repository
      description: Requires an authenticated user. Repository configuration responses do not include GitHub credentials.
      operationId: getRepository
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The repository configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "401":
          description: Authentication is required
        "404":
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
        - Repositories
      summary: Update repository configuration or active state
      description: Requires an authenticated user with the ADMIN role. Set active to false to deactivate; repository deletion is not supported.
      operationId: updateRepository
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryPatchRequest"
      responses:
        "200":
          description: The updated repository configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          description: No update fields were provided, or a supplied string is blank or exceeds its maximum length
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
        "403":
          description: The authenticated user does not have the ADMIN role
        "404":
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The updated GitHub owner and repository name are already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/repositories/{repositoryId}/documents:
    parameters:
      - name: repositoryId
        in: path
        required: true
        description: Internal application repository ID
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Repositories
        - Documents
      summary: List documents from a configured repository
      description: Requires an authenticated user. Documents are retrieved using the selected repository configuration. An inactive repository or retrieval failure currently returns 502.
      operationId: getRepositoryDocuments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Documents available from the selected repository
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "401":
          description: Authentication is required
        "404":
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The repository is inactive or document retrieval failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/repositories/{repositoryId}/documents/{slug}:
    parameters:
      - name: repositoryId
        in: path
        required: true
        description: Internal application repository ID
        schema:
          type: integer
          format: int64
      - name: slug
        in: path
        required: true
        description: Document slug within the selected repository
        schema:
          type: string
    get:
      tags:
        - Repositories
        - Documents
      summary: Get a document from a configured repository
      description: Requires an authenticated user. A repository-specific Redis cache is used; cache keys include the internal repository ID. An inactive repository or retrieval failure currently returns 502.
      operationId: getRepositoryDocument
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          description: Authentication is required
        "404":
          description: Repository or document not found. A missing document returns an empty response body; an unknown repository returns an ApiError.
        "502":
          description: The repository is inactive or document retrieval failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/webhooks/github:
    post:
      tags:
        - Webhooks
      summary: Process a GitHub webhook
      operationId: processGithubWebhook
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: GitHub HMAC SHA-256 signature
          schema:
            type: string
            example: sha256=abc123
        - name: X-GitHub-Event
          in: header
          required: true
          description: GitHub event type
          schema:
            type: string
            example: push
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: Unique GitHub delivery identifier
          schema:
            type: string
            example: 72d3162e-cc78-11e3-81ab-4c9367b1baf2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Webhook accepted
        "400":
          description: Invalid webhook request
        "401":
          description: Invalid webhook signature

  /api/v1/health:
    get:
      tags:
        - Health
      summary: Check application health
      operationId: health
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Document:
      type: object
      required:
        - slug
        - title
        - content
        - html
        - sourcePath
      properties:
        slug:
          type: string
          example: getting-started
        title:
          type: string
          example: Getting Started
        description:
          type: string
          nullable: true
          example: Introduction to Git-Prasaaran
        content:
          type: string
          description: Raw Markdown source
        html:
          type: string
          description: Sanitized HTML rendered by the backend
        sourcePath:
          type: string
          example: docs/architecture.md

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: DOCUMENT_NOT_FOUND
        message:
          type: string
          example: Document not found

    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: REPOSITORY_NOT_FOUND
        message:
          type: string
          example: Repository not found

    RepositoryCreateRequest:
      type: object
      required:
        - owner
        - name
        - branch
        - contentPath
      properties:
        owner:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          description: GitHub repository owner; must not be blank
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          description: GitHub repository name; must not be blank
        branch:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          description: Git branch; must not be blank
        contentPath:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: Path containing documentation content; must not be blank

    RepositoryPatchRequest:
      type: object
      description: At least one non-null property must be supplied. Null properties are treated as omitted.
      anyOf:
        - required:
            - owner
          properties:
            owner:
              type: string
        - required:
            - name
          properties:
            name:
              type: string
        - required:
            - branch
          properties:
            branch:
              type: string
        - required:
            - contentPath
          properties:
            contentPath:
              type: string
        - required:
            - active
          properties:
            active:
              type: boolean
      properties:
        owner:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
        branch:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
        contentPath:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
        active:
          type: boolean
          nullable: true
          description: Set to false to deactivate or true to activate the repository

    Repository:
      type: object
      description: Application-level configuration referencing a GitHub repository. No credentials or tokens are returned.
      required:
        - id
        - owner
        - name
        - branch
        - contentPath
        - active
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: Stable internal repository identifier
        owner:
          type: string
        name:
          type: string
        branch:
          type: string
        contentPath:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: UP
