spring:
  application:
    name: git-prasaaran-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gitprasaaran}
    username: ${DB_USERNAME:gitprasaaran}
    password: ${DB_PASSWORD:gitprasaaran}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

gitprasaaran:
  github:
    owner: ${GITHUB_OWNER:}
    repository: ${GITHUB_REPOSITORY:}
    branch: ${GITHUB_BRANCH:main}
    content-path: ${GITHUB_CONTENT_PATH:docs}
    token: ${GITHUB_TOKEN:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 900
      issuer: git-prasaaran
