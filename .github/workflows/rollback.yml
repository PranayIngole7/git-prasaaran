name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      previous_deploy_id:
        description: Render deployment ID of the previous known-good deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: git-prasaaran-production
  cancel-in-progress: false

jobs:
  rollback-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://git-prasaaran-backend.onrender.com/

    steps:
      - name: Validate rollback configuration
        env:
          PREVIOUS_DEPLOY_ID: ${{ inputs.previous_deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PREVIOUS_DEPLOY_ID" =~ ^[A-Za-z0-9_-]{6,100}$ ]] || {
            echo "Invalid Render deployment ID format." >&2
            exit 1
          }
          [[ -n "$RENDER_API_KEY" ]] || {
            echo "Missing RENDER_API_KEY GitHub secret." >&2
            exit 1
          }
          [[ -n "$RENDER_SERVICE_ID" ]] || {
            echo "Missing RENDER_SERVICE_ID GitHub secret." >&2
            exit 1
          }
          [[ "$PROD_HEALTH_URL" == https://* ]] || {
            echo "PROD_HEALTH_URL must be an HTTPS URL." >&2
            exit 1
          }

      - name: Verify target deployment
        env:
          PREVIOUS_DEPLOY_ID: ${{ inputs.previous_deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail-with-body --silent --show-error \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${PREVIOUS_DEPLOY_ID}" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json")"

          actual_id="$(jq -er '.id' <<< "$response")"
          status="$(jq -er '.status' <<< "$response")"

          [[ "$actual_id" == "$PREVIOUS_DEPLOY_ID" ]] || {
            echo "Render returned an unexpected deployment ID." >&2
            exit 1
          }

          [[ "$status" == "deactivated" ]] || {
            echo "Rollback target must be a previous deactivated deployment; current status: $status" >&2
            exit 1
          }

          echo "Verified previous deployment: $actual_id"

      - name: Trigger Render rollback
        id: rollback
        env:
          PREVIOUS_DEPLOY_ID: ${{ inputs.previous_deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/rollback" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"deployId\":\"${PREVIOUS_DEPLOY_ID}\"}")"

          deploy_id="$(jq -er '.id' <<< "$response")"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Render accepted rollback deployment $deploy_id"

      - name: Wait for rollback to become live
        env:
          DEPLOY_ID: ${{ steps.rollback.outputs.deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            response="$(curl --fail-with-body --silent --show-error \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json")"

            status="$(jq -er '.status' <<< "$response")"
            echo "Rollback status: $status ($attempt/60)"

            if [[ "$status" == "live" ]]; then
              exit 0
            fi

            case "$status" in
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "Rollback failed with status: $status" >&2
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Timed out waiting for rollback." >&2
          exit 1

      - name: Verify production health after rollback
        env:
          PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PROD_HEALTH_URL"; then
              echo
              echo "Rollback health verification passed."
              exit 0
            fi

            echo "Health check failed; retry $attempt/12."
            sleep 10
          done

          echo "Rollback health verification failed." >&2
          exit 1
