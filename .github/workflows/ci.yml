name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    backend:
        name: Backend Tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: gitprasaaran
                    POSTGRES_USER: gitprasaaran
                    POSTGRES_PASSWORD: gitprasaaran
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U gitprasaaran -d gitprasaaran"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Create PostgreSQL integration test database
              env:
                  PGPASSWORD: gitprasaaran
              run: createdb --host localhost --username gitprasaaran gitprasaaran_integration_test

            - name: Validate OpenAPI contract
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Check OpenAPI contract
              run: npx --yes @redocly/cli@latest lint openapi.yaml

            - name: Run backend tests
              working-directory: backend
              env:
                  DB_URL: jdbc:postgresql://localhost:5432/gitprasaaran
                  DB_USERNAME: gitprasaaran
                  DB_PASSWORD: gitprasaaran
                  REDIS_HOST: localhost
                  REDIS_PORT: "6379"
                  JWT_SECRET: ci-only-secret-do-not-use-outside-tests
                  GITHUB_OWNER: example
                  GITHUB_REPOSITORY: example-docs
                  GITHUB_BRANCH: main
                  GITHUB_CONTENT_PATH: docs
              run: ./mvnw --batch-mode test

    frontend:
        name: Frontend Checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            - name: Run frontend tests
              working-directory: frontend
              run: npm test

            - name: Run frontend lint
              working-directory: frontend
              run: npm run lint

            - name: Build frontend
              working-directory: frontend
              run: npm run build

    mcp-server:
        name: MCP Server Checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: mcp-server/package-lock.json

            - name: Install dependencies
              working-directory: mcp-server
              run: npm ci

            - name: Run MCP tests
              working-directory: mcp-server
              run: npm test

            - name: Build MCP server
              working-directory: mcp-server
              run: npm run build

    agent-hook:
        name: Agent Hook Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Test Markdown validation hook
              run: node --test agent-hooks/tests/validate-markdown.test.mjs

    secret-scan:
        name: Secret Scanning
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Scan repository for secrets
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    dependency-review:
        name: Dependency Review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Review dependency changes
              uses: actions/dependency-review-action@v4
              with:
                  fail-on-severity: high
