name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character Git commit SHA to deploy from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: git-prasaaran-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://git-prasaaran-backend.onrender.com/

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate commit and deployment configuration
        id: validate
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Provide a full 40-character commit SHA." >&2
            exit 1
          }

          git cat-file -e "${COMMIT_SHA}^{commit}"
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main || {
            echo "The requested commit is not an ancestor of origin/main." >&2
            exit 1
          }

          [[ -n "$RENDER_API_KEY" ]] || {
            echo "Missing RENDER_API_KEY GitHub secret." >&2
            exit 1
          }
          [[ -n "$RENDER_SERVICE_ID" ]] || {
            echo "Missing RENDER_SERVICE_ID GitHub secret." >&2
            exit 1
          }
          [[ "$PROD_HEALTH_URL" == https://* ]] || {
            echo "PROD_HEALTH_URL must be an HTTPS URL." >&2
            exit 1
          }

          echo "Deploying commit: $COMMIT_SHA"

      - name: Trigger Render deployment
        id: deploy
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"${COMMIT_SHA}\"}")"

          deploy_id="$(jq -er '.id' <<< "$response")"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Render accepted deployment $deploy_id"

      - name: Wait for deployment to become live
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            response="$(curl --fail-with-body --silent --show-error \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json")"

            status="$(jq -er '.status' <<< "$response")"
            echo "Deployment status: $status ($attempt/60)"

            if [[ "$status" == "live" ]]; then
              exit 0
            fi

            case "$status" in
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "Deployment failed with status: $status" >&2
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Timed out waiting for Render deployment." >&2
          exit 1

      - name: Verify production health
        env:
          PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PROD_HEALTH_URL"; then
              echo
              echo "Production health check passed."
              exit 0
            fi

            echo "Health check failed; retry $attempt/12."
            sleep 10
          done

          echo "Production health verification failed." >&2
          exit 1
